# Tests write their export files under target/, never into data/.
export.storage.directory=target/test-exports

# The demo subscribers are tested on their own (SubscriberSettingsTest); the other tests start from no subscriber.
export.demo-data=false

# The test tables (tg_...) have no gs_ prefix; the tests read them in the test database's own schema.
export.source.table-prefix=
