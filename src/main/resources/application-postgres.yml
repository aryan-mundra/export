# PostgreSQL: the table groups (config/table-groups.yml) are read from PostgreSQL, and the module's own ver_export_
# tables are written to the same database.
#
# Set the connection with environment variables (the sidebar's Database switch uses config/database.properties):
#   REGLISS_DB_URL       default jdbc:postgresql://localhost:5432/regliss
#   REGLISS_DB_USER      default regliss
#   REGLISS_DB_PASSWORD  required
spring:
  datasource:
    url: ${REGLISS_DB_URL:jdbc:postgresql://localhost:5432/regliss}
    username: ${REGLISS_DB_USER:regliss}
    password: ${REGLISS_DB_PASSWORD:}
    hikari:
      pool-name: regliss-postgres
      maximum-pool-size: 10
      connection-timeout: 10000
  # The tables are created once, by hand: run db/postgres/ver-export-schema.sql in psql or pgAdmin.
  # The application never creates or alters a table here; it only reads and writes rows.
  sql:
    init:
      mode: never
  jpa:
    hibernate:
      ddl-auto: ${REGLISS_DDL_AUTO:none}

export:
  delivery:
    # Keep sends simulated while testing; set to false to POST files to real CFT endpoints.
    mock: true
  demo-data: true
  # Dumps put in db/dumps are imported into this database when the application starts (see db/dumps/README.md).
  import:
    enabled: ${REGLISS_IMPORT_ENABLED:true}
    directory: ${REGLISS_IMPORT_DIR:db/dumps}
    # Folder with psql and pg_restore; empty = the PATH, then the newest PostgreSQL under C:/Program Files/PostgreSQL.
    bin-dir: ${PG_BIN:}
