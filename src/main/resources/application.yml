# Defaults of the Export module, packed in the jar. Settings you change per machine go in the config/ folder:
#   config/database.properties   the PostgreSQL connection (used by the sidebar's Database switch)
#   config/application.yml       optional: any setting below, to override it without rebuilding (Spring Boot reads it)
#
# Without a choice the module runs on an in-memory H2 database (PostgreSQL mode, the same SQL as on PostgreSQL).
# To run on PostgreSQL: the Database switch, or the postgres profile (see docs/postgres-testing.md).
server:
  port: 8082
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
        secure: false

spring:
  application:
    name: export-module
  datasource:
    url: jdbc:h2:mem:regliss;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password: ""
  # Hibernate never creates tables: db/postgres/ver-export-schema.sql is the schema, on H2 as on PostgreSQL.
  sql:
    init:
      mode: always
      # Packed into the jar from db/ (see pom.xml), so this works whatever folder the module is started from.
      schema-locations: classpath:db/postgres/ver-export-schema.sql
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  jackson:
    serialization:
      write-dates-as-timestamps: false
  web:
    resources:
      cache:
        period: 0

export:
  # The source tables: the table groups are discovered from the primary and foreign keys of this schema
  # (information_schema), so nothing is configured per table. Empty = the connection's current schema
  # (PostgreSQL: the first schema of the search_path). Example: dj_demo.
  source:
    schema: ${REGLISS_SOURCE_SCHEMA:}
    # How long the discovered groups are kept before the keys are read again.
    cache-seconds: 60
  delivery:
    # true: CFT sends are simulated. false: files are POSTed to each subscriber's endpoint.
    mock: true
    # How long one delivery may take before it fails (and is retried once).
    timeout-minutes: 60
  # Show the demo sign-in accounts on the sign-in page.
  demo-data: true
  # At start-up, mark sends that were running when the application stopped as FAILED (retryable).
  # Turn off if several application instances share one database.
  recover-interrupted: true
  storage:
    directory: data/exports

logging:
  level:
    com.bnpp.export: INFO
