# Default: everything runs in an in-memory H2 database with generated demo data. H2 runs in
# PostgreSQL mode with lower-case names, and the module uses the same SQL as on PostgreSQL.
# To run against PostgreSQL instead (see docs/postgres-testing.md):
#   mvn spring-boot:run -Dspring-boot.run.profiles=postgres
server:
  port: 8082
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
        secure: false

spring:
  profiles:
    active: mock
  application:
    name: export-module
  datasource:
    url: jdbc:h2:mem:regliss;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  jackson:
    serialization:
      write-dates-as-timestamps: false
  web:
    resources:
      cache:
        period: 0

export:
  mock:
    # true: demo certified versions, list entries and gs_ tables are seeded into the H2 database.
    # false: they are already in the database (the postgres profile).
    enabled: true
    records-per-subscriber: 400
  delivery:
    # true: CFT sends are simulated. false: files are POSTed to each subscriber's endpoint.
    mock: true
  # Seed demo subscribers and show the demo sign-in accounts when the database has none.
  demo-data: true
  # At start-up, mark exports that were running when the application stopped as FAILED (retryable).
  # Turn off if several application instances share one database.
  recover-interrupted: true
  storage:
    directory: data/exports

logging:
  level:
    com.bnpp.export: INFO
