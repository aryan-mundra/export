# Default: everything runs in an in-memory H2 database with generated demo data.
# To run against Oracle instead (see docs/oracle-testing.md):
#   mvn spring-boot:run -Dspring-boot.run.profiles=oracle
server:
  port: 8082
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
        secure: false

spring:
  profiles:
    active: mock
  application:
    name: export-module
  datasource:
    url: jdbc:h2:mem:regliss;DB_CLOSE_DELAY=-1;MODE=Oracle
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  jackson:
    serialization:
      write-dates-as-timestamps: false
  web:
    resources:
      cache:
        period: 0

export:
  mock:
    # true: list records, certified versions and gs_ tables are generated in memory.
    # false: they are read from the database (the oracle profile).
    enabled: true
    records-per-subscriber: 50
  delivery:
    # true: CFT sends are simulated. false: files are POSTed to each subscriber's endpoint.
    mock: true
  # Seed demo subscribers and show the demo sign-in accounts when the database has none.
  demo-data: true
  # At start-up, mark exports that were running when the application stopped as FAILED (retryable).
  # Turn off if several application instances share one database.
  recover-interrupted: true
  storage:
    directory: data/exports

logging:
  level:
    com.bnpp.export: INFO
